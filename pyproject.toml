[project]
name = "warsaw-transit-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.31.0",
    "boto3>=1.43.22",
    "certifi==2026.4.22",
    "charset-normalizer==3.4.7",
    "dotenv==0.9.9",
    "idna==3.15",
    "logging==0.4.9.6",
    "numpy==2.4.4",
    "pandas==3.0.3",
    "pendulum>=3.2.0",
    "psycopg2==2.9.12",
    "psycopg2-binary==2.9.12",
    "pyarrow==24.0.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "six==1.17.0",
    "urllib3==2.7.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]
